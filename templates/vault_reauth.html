<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Identity - Gemini Personal Journal</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container vault-login">

        <h1>Verify Your Identity</h1>

        <p class="subtitle">
            Re-authenticate with Google before resetting your Vault PIN.
        </p>

        <button id="reauth-button">
            Verify with Google
        </button>

        <p id="reauth-error" class="vault-error"></p>

        <br>

        <a href="/vault" class="back-link">
            Back to Vault
        </a>

    </div>


    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getAuth,
            GoogleAuthProvider,
            reauthenticateWithPopup,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyDInuEZ0kbHbdcMj0KHa7839jxVs1s6nrY",
            authDomain: "gen-lang-client-0715483676.firebaseapp.com",
            projectId: "gen-lang-client-0715483676",
            storageBucket: "gen-lang-client-0715483676.firebasestorage.app",
            messagingSenderId: "767164856928",
            appId: "1:767164856928:web:94244abcce245c0f1da105",
            measurementId: "G-Y4CRR20E2T"
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const provider = new GoogleAuthProvider();

        const reauthButton =
            document.getElementById("reauth-button");

        const errorMessage =
            document.getElementById("reauth-error");

        let currentUser = null;


        onAuthStateChanged(auth, (user) => {

            currentUser = user;

            if (!user) {
                errorMessage.textContent =
                    "Firebase session not found. Please sign in again.";
            }

        });


        reauthButton.addEventListener(
            "click",
            async () => {

                errorMessage.textContent = "";

                if (!currentUser) {

                    errorMessage.textContent =
                        "Please sign in again before resetting your Vault PIN.";

                    return;
                }

                try {

                    reauthButton.disabled = true;

                    reauthButton.textContent =
                        "Verifying...";


                    await reauthenticateWithPopup(
                        currentUser,
                        provider
                    );


                    const idToken =
                        await currentUser.getIdToken(true);


                    const response = await fetch(
                        "/vault-reauth",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                token: idToken
                            })
                        }
                    );


                    const result =
                        await response.json();


                    if (response.ok && result.success) {

                        window.location.href =
                            "/vault-reset";

                    } else {

                        errorMessage.textContent =
                            result.message ||
                            "Google verification failed.";

                        reauthButton.disabled = false;

                        reauthButton.textContent =
                            "Verify with Google";

                    }

                } catch (error) {

                    console.error(
                        "Vault reauthentication error:",
                        error
                    );

                    errorMessage.textContent =
                        "Google verification was cancelled or failed.";

                    reauthButton.disabled = false;

                    reauthButton.textContent =
                        "Verify with Google";

                }

            }
        );

    </script>

</body>
</html>
